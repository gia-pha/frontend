# demo mode: identical to the default nginx config, except that all /api/
# calls are proxied to the pact stub server. Same-origin, so the sid cookie
# and credentials:'include' work without any CORS.
server {
    listen       80;
    server_name  localhost;

    location /api/ {
        proxy_pass http://stub-server:8090;
        proxy_set_header Host $host;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
